<style>
/* Layout: one arcade cabinet, centred. Screen (canvas, 4:5) on top, caption bar under it, control deck at the bottom. Single dark look by choice. */
:root{
  --cab:#0a0c16;      /* cabinet body */
  --screen:#05070e;   /* glass */
  --line:#1d2742;     /* grid, borders */
  --dim:#6b77a0;      /* secondary text */
  --fg:#e9edff;       /* main text */
  --cyan:#5ff3ff;     /* velocity, highlights */
  --amber:#ffb547;    /* force, questions */
  --green:#7dff9a;    /* understanding */
  --f-display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,sans-serif;
  --f-mono:"VT323",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--cab);color:var(--fg);font-family:var(--f-body)}
.app{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:10px;padding-block:12px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.strip,.screen,.cap,.pips,.deck,.transcript{width:min(100%,560px,calc((100vh - 225px)*.8));width:min(100%,560px,calc((100svh - 225px)*.8));min-width:min(100%,280px)}
.strip{display:flex;justify-content:space-between;align-items:baseline;gap:12px;white-space:nowrap;font-family:var(--f-mono);font-size:17px;color:var(--dim);letter-spacing:.04em}
.strip b{color:var(--cyan);font-weight:400}
.strip .right{display:flex;gap:10px;align-items:center}
.sndbtn{font-family:var(--f-mono);font-size:18px;color:var(--screen);background:var(--amber);border:0;border-radius:7px;padding:3px 10px;cursor:pointer;display:flex;gap:6px;align-items:center;letter-spacing:.04em}
.sndbtn svg{width:16px;height:16px;fill:currentColor}
.sndbtn.off{animation:pulse 1.4s ease-in-out infinite}
.sndbtn.on{color:var(--green);background:transparent;box-shadow:inset 0 0 0 2px var(--green)}
.sndbtn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
@media (max-width:440px){.strip .wide{display:none}.strip{font-size:16px}.sndbtn{font-size:16px;padding:3px 8px}}
@keyframes pulse{50%{box-shadow:0 0 14px rgba(255,181,71,.8)}}
@media (prefers-reduced-motion:reduce){.sndbtn.off{animation:none}}
.screen{position:relative;aspect-ratio:4/5;max-width:100%;border-radius:14px;overflow:hidden;background:var(--screen);box-shadow:0 0 0 2px var(--line),0 0 0 9px #11152a,0 0 40px rgba(95,243,255,.12);cursor:pointer;touch-action:manipulation}
.screen canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.025) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.45) 100%)}
.paused{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--f-mono);font-size:26px;color:var(--amber);background:rgba(5,7,14,.85);border:2px solid var(--amber);padding:6px 16px;border-radius:8px;pointer-events:none;letter-spacing:.05em}
.cap{margin:0;min-height:3.9em;font-size:clamp(15px,2.2vw,18px);line-height:1.35;text-wrap:balance;text-align:center;color:var(--fg);padding:10px 14px;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;background:#070a14;transition:opacity .25s}
.cap.fade{opacity:.15}
.pips{display:flex;gap:3px}
.pips button{flex:1;height:14px;padding:4px 0;border:0;background:transparent;cursor:pointer;min-width:0}
.pips button span{display:block;height:6px;border-radius:3px;background:var(--line);overflow:hidden;position:relative}
.pips button span i{position:absolute;inset:0 auto 0 0;background:var(--cyan);box-shadow:0 0 6px var(--cyan)}
.pips button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.deck{display:flex;gap:6px;justify-content:center}
.deck button{font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.05em;color:var(--fg);background:#0e1324;border:2px solid var(--line);border-radius:10px;min-height:46px;padding:0 11px;display:flex;align-items:center;gap:8px;cursor:pointer}
.deck button svg{width:18px;height:18px;fill:currentColor}
.deck button.main{color:var(--screen);background:var(--amber);border-color:var(--amber);min-width:104px;justify-content:center}
.deck button:hover{border-color:var(--cyan)}
.deck button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.transcript{font-size:15px;color:var(--dim)}
.transcript summary{cursor:pointer;font-family:var(--f-display);font-weight:600;letter-spacing:.05em;color:var(--fg);padding:6px 0}
.transcript h3{font-family:var(--f-mono);font-weight:400;font-size:20px;color:var(--cyan);margin:14px 0 4px}
.transcript p{margin:0 0 6px;color:var(--fg);line-height:1.45;max-width:65ch}
</style>

}},
