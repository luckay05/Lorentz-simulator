<style>
/* Layout: one phone screen; title row, one-line equation strip, 3D field stage, hint row. Single bright theme by choice. */
:root{
  --bg:#EEF1F6; --card:#FFFFFF; --line:#D5DBE6; --ink:#10131A; --muted:#5A6275;
  --blue:#1F5EE0; --blue-soft:#EDF2FD; --blue-ink:#163F96;
  --amber-soft:#FFE3CC; --amber-ink:#8A3A00;
  --font:'Space Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:var(--font);touch-action:manipulation;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#app{height:100%;box-sizing:border-box;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding-block:10px 6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-0.02em;white-space:nowrap}
.icons{display:flex;gap:6px}
.ib{width:44px;height:44px;border-radius:22px;background:var(--card);border:1px solid var(--line);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0}
.ib[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#FFFFFF}
.eq{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:7px 16px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;color:var(--ink);min-height:38px;justify-content:center}
.eq .line{font-size:15px;font-variant-numeric:tabular-nums;line-height:1.3}
.eq .line b{color:var(--blue-ink)}
.eq .hl{background:var(--amber-soft);color:var(--amber-ink);border-radius:6px;padding:0 4px;font-weight:700}
.eq .badge{background:var(--amber-soft);color:var(--amber-ink);border-radius:10px;padding:2px 10px;font-size:13px;font-weight:700}
.eq .gc{display:inline-block;border-radius:8px;padding:1px 7px;margin-right:4px;font-size:13px;background:var(--blue-soft);color:var(--blue-ink)}
.eq .gc.me{background:var(--blue);color:#FFFFFF}
#stageWrap{position:relative;flex:1;min-height:0}
#gl,#ov{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{touch-action:none}
.foot{display:flex;align-items:center;gap:10px;min-height:44px}
#hint{font-size:12px;color:var(--muted);line-height:1.3;min-height:16px;padding:0 4px}
#startBtn{position:absolute;left:0;top:0;z-index:2;height:32px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:var(--ink);font-size:12px;padding:0 12px;white-space:nowrap}
.back{position:fixed;inset:0;background:rgba(16,19,26,.32);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:520px;margin:0 auto;background:var(--card);border-radius:28px 28px 0 0;display:flex;flex-direction:column;gap:16px;padding-block:12px calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));box-sizing:border-box}
.grab{align-self:center;width:44px;height:5px;border-radius:3px;background:#C3CAD8}
.sh{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sh h2{margin:0;font-size:22px;font-weight:700}
.sub{margin:-10px 0 0;font-size:14px;color:var(--muted)}
.lab{font-size:13px;color:var(--muted);letter-spacing:0.04em;display:flex;justify-content:space-between}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;background:var(--bg);border-radius:16px;padding:4px}
.seg button{height:44px;border:0;border-radius:12px;background:transparent;font-size:16px;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--blue);color:#FFFFFF;font-weight:700}
.mults{display:flex;gap:8px}
.mults button{flex:1;height:44px;border-radius:22px;background:var(--card);border:1px solid var(--line);font-size:15px;color:var(--ink)}
.mults button[aria-pressed="true"]{background:var(--blue-soft);border:2px solid var(--blue);color:var(--blue-ink);font-weight:700}
.tones{display:flex;gap:12px}
.tones button{width:44px;height:44px;border-radius:22px;border:3px solid transparent;padding:0}
.tones button[aria-pressed="true"]{border-color:var(--blue)}
.sw{position:relative;width:52px;height:32px;flex:none}
.sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:16px;background:#C3CAD8;transition:background .2s}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:13px;background:#FFFFFF;transition:transform .2s}
.sw input:checked+span{background:var(--blue)}
.sw input:checked+span::after{transform:translateX(20px)}
.sw input:focus-visible+span{outline:3px solid var(--blue);outline-offset:2px}
.primary{height:54px;border-radius:27px;background:var(--ink);color:#FFFFFF;border:0;font-size:16px;font-weight:700}
@media (prefers-reduced-motion: reduce){.sw span,.sw span::after{transition:none}}
</style>

<div id="app">
  <div class="top">

    <div class="icons">
      <button class="ib" id="ghostBtn" aria-label="Compare with ghost particles" aria-pressed="false">

      </button>

  </div>
  <button class="eq" id="eq" aria-label="Equation, tap to switch"></button>

<div class="back" id="ghostBack" hidden></div>
<section class="sheet" id="ghostSheet" hidden aria-label="Ghost particles">
  <div class="grab"></div>
  <div class="sh"><h2>Compare with ghosts</h2><label class="sw" aria-label="Ghosts on"><input type="checkbox" id="gOn"><span></span></label></div>
  <p class="sub">Change one thing. Everything else stays the same.</p>
  <div class="lab"><span>What changes</span></div>
  <div class="seg" id="gVar"><button data-v="q">q</button><button data-v="m">m</button><button data-v="v">v</button><button data-v="B">B</button></div>

  <div class="mults" id="gMult"><button data-k="0.25">×¼</button><button data-k="0.5">×½</button><button data-k="2">×2</button><button data-k="3">×3</button></div>
  <button class="primary" id="gDone">Done</button>
</section>

<div class="back" id="handBack" hidden></div>
<section class="sheet" id="handSheet" hidden aria-label="Hand">
  <div class="grab"></div>
  <div class="sh"><h2>Right-hand palm rule</h2><label class="sw" aria-label="Show hand"><input type="checkbox" id="hOn"><span></span></label></div>
  <p class="sub">Fingers along B, thumb along v, palm pushes F.</p>
  <div class="lab"><span>Skin tone</span></div>
  <div class="tones" id="tones"></div>
  <button class="primary" id="hDone">Done</button>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const ov=$('#ov'), ctx=ov.getContext('2d'), glc=$('#gl');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let HAS3=!!window.THREE;
const FONT="'Space Grotesk', ui-sans-serif, system-ui, sans-serif";
const C={ink:'#10131A',muted:'#5A6275',grey:'#8A93A6',pad:'#C3CAD8',orange:'#E8590C',orangeInk:'#B5440A',green:'#1E8A4C',greenInk:'#14593A',amberInk:'#8A3A00',blueInk:'#4A6AB0',bg:'#EEF1F6'};
const TONES=['#F6D2B8','#F0B48C','#C68456','#8D5524','#5C3A1E'];
const BOX=4.5;
let store={}; try{store=JSON.parse(localStorage.getItem('lorentzlab')||'{}')||{}}catch(e){store={}}
const S={q:1,qMem:1,m:1,B:1,phi:0,phiLive:0,v:2,pullV:0,pullOff:0,eye:true,inside:false,mode:'idle',eqMode:'r',
  ghost:{on:false,v:'m',mult:[0.5,2]},hl:[],expandT:0,badgeTxt:'',popT:0,fadeT:1,tilt:1,
  hand:store.hand!==false,tone:(typeof store.tone==='number'?store.tone:1),editing:false};
function save(){try{localStorage.setItem('lorentzlab',JSON.stringify({hand:S.hand,tone:S.tone}))}catch(e){}}
let G={}, main=null, ghosts=[], bursts=[], preds=[], gesture=null, last=performance.now();
const pointers=new Map();

const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const r1=x=>Math.round(x*10)/10;
const f1=x=>(Math.abs(x)<1&&x!==0)?x.toFixed(2):x.toFixed(1);
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}};
const norm=p=>((Math.round(p)%360)+360)%360;
const DIRS={0:'out of page',90:'along v',180:'into page',270:'against v'};
function Bz(B){const p=norm(S.phi);return p===0?B:p===180?-B:0;}
function params(v){return {q:S.q,m:S.m,B:S.B,v:v==null?S.v:v};}
function rOf(p){const bz=Bz(p.B);if(!p.q||!bz)return Infinity;return p.m*p.v/(Math.abs(p.q)*Math.abs(bz));}
function curV(){return S.mode==='idle'?(S.pullV>0?S.pullV:S.v):(main?main.v:S.v);}
function fK(k){return ({0.25:'×¼',0.5:'×½',2:'×2',3:'×3'})[k]||('×'+(Math.round(k*100)/100));}
function fFactor(k){if(!isFinite(k))return '';const t=[[0.25,'×¼'],[1/3,'×⅓'],[0.5,'×½'],[2,'×2'],[3,'×3'],[4,'×4'],[1,'×1']];for(const [v,s] of t)if(Math.abs(k-v)<0.02)return s;return '×'+(Math.round(k*100)/100);}
function qRGB(q){
  if(!q)return [154,160,170];
  const t=clamp((Math.abs(q)-0.1)/2.9,0,1), c=q>0?[[232,131,138],[168,35,31]]:[[142,152,240],[43,47,143]];
  return [0,1,2].map(i=>Math.round(c[0][i]+(c[1][i]-c[0][i])*t));
}
function qColor(q,a){return 'rgba('+qRGB(q).join(',')+','+a+')';}
function qText(q){return q?(q>0?'+':'−')+Math.abs(q).toFixed(1)+'e':'0';}

/* ---------- physics (world units, y up) ---------- */
function inBox(x,y){return Math.abs(x)<BOX&&Math.abs(y)<BOX;}
function padW(){return S.inside?{x:0,y:0}:{x:0,y:-BOX-1.15-0.9*S.tilt};}
function mk(p,tag,k){const w=padW();return {x:w.x,y:w.y,vx:0,vy:p.v,q:p.q,m:p.m,B:p.B,v:p.v,entered:S.inside,alive:true,trail:[[w.x,w.y]],tag,k};}
function rot(P,a){const c=Math.cos(a),s=Math.sin(a),vx=P.vx*c-P.vy*s,vy=P.vx*s+P.vy*c;P.vx=vx;P.vy=vy;}
function step(P,dt){
  const ins=inBox(P.x,P.y); if(ins)P.entered=true;
  const bz=Bz(P.B);
  if(ins&&P.q&&bz){const a=-(P.q*bz/P.m)*dt/2;rot(P,a);P.x+=P.vx*dt;P.y+=P.vy*dt;rot(P,a);}
  else{P.x+=P.vx*dt;P.y+=P.vy*dt;}
  if((P.entered&&!inBox(P.x,P.y))||Math.abs(P.x)>40||Math.abs(P.y)>40)P.alive=false;
}
function simulate(P0){
  const P=Object.assign({},P0), pts=[[P.x,P.y]], dt=1/120;
  const om=Math.abs(P.q*Bz(P.B)/P.m), maxT=om>0?Math.min(2*Math.PI/om+0.4,30):15;
  for(let t=0,i=0;t<maxT&&P.alive;t+=dt,i++){step(P,dt);if(i%3===0)pts.push([P.x,P.y]);}
  return pts;
}
function ghostParams(k,base){const p=Object.assign({},base);p[S.ghost.v]*=k;return p;}

/* ---------- 3D scene ---------- */
let renderer,scene,cam,cube,dartGroup,lineGroup,dartMat,dartDark,lineMat,hand,thumbG,skinMat,nailMat,fieldN=0,darts=[];
const V=HAS3?{a:new THREE.Vector3(),X:new THREE.Vector3(),Y:new THREE.Vector3(),Z:new THREE.Vector3(),M:new THREE.Matrix4(),Q:new THREE.Quaternion(),T:new THREE.Vector3(),thumbTip:new THREE.Vector3(0.05,1.27,0),palm:new THREE.Vector3(0.05,0,-0.2),tips:new THREE.Vector3(1.55,0.05,0)}:null;
let handPar=false, handAlpha=0;
function init3(){
  renderer=new THREE.WebGLRenderer({canvas:glc,antialias:true,alpha:true});
  renderer.setClearColor(0x000000,0);
  scene=new THREE.Scene();
  cam=new THREE.OrthographicCamera(-1,1,1,-1,1,200);
  scene.add(new THREE.AmbientLight(0xffffff,0.62));
  const dl=new THREE.DirectionalLight(0xffffff,0.7); dl.position.set(4,7,9); scene.add(dl);
  cube=new THREE.Group();
  const bg=new THREE.BoxGeometry(9,9,9);
  cube.add(new THREE.Mesh(bg,new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.32,depthWrite:false,side:THREE.DoubleSide})));
  cube.add(new THREE.LineSegments(new THREE.EdgesGeometry(bg),new THREE.LineBasicMaterial({color:0xAEB7C6})));
  scene.add(cube);
  dartMat=new THREE.MeshLambertMaterial({color:0x1E8A4C,transparent:true});
  dartDark=new THREE.MeshLambertMaterial({color:0x14593A,transparent:true});
  lineMat=new THREE.MeshLambertMaterial({color:0x1E8A4C,transparent:true,opacity:0});
  dartGroup=new THREE.Group(); scene.add(dartGroup);
  lineGroup=new THREE.Group(); scene.add(lineGroup);
  buildHand();
}
const geo={};
function makeDart(){
  if(!geo.shaft){geo.shaft=new THREE.CylinderGeometry(0.035,0.035,0.5,8);geo.cone=new THREE.ConeGeometry(0.13,0.26,16);geo.tip=new THREE.SphereGeometry(0.05,10,8);geo.fin=new THREE.BoxGeometry(0.26,0.16,0.014);}
  const g=new THREE.Group(), inner=new THREE.Group();
  inner.add(new THREE.Mesh(geo.shaft,dartMat));
  const c=new THREE.Mesh(geo.cone,dartMat); c.position.y=0.38; inner.add(c);
  const t=new THREE.Mesh(geo.tip,dartDark); t.position.y=0.5; inner.add(t);
  const f1=new THREE.Mesh(geo.fin,dartDark); f1.position.y=-0.2; f1.rotation.y=Math.PI/4; inner.add(f1);
  const f2=f1.clone(); f2.rotation.y=-Math.PI/4; inner.add(f2);
  inner.rotation.x=Math.PI/2; inner.position.z=-0.08;
  g.add(inner); return g;
}
function buildField(){
  const n=clamp(Math.round(6*Math.sqrt(S.B)),3,9); if(n===fieldN)return; fieldN=n;
  dartGroup.clear(); lineGroup.clear(); darts=[];
  const sp=9/n;
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){const d=makeDart();d.position.set(-BOX+sp*(i+0.5),-BOX+sp*(j+0.5),0);dartGroup.add(d);darts.push(d);}
  if(!geo.lc){geo.lc=new THREE.CylinderGeometry(0.04,0.04,9,8);geo.la=new THREE.ConeGeometry(0.14,0.3,14);}
  for(let i=0;i<n;i++){
    const x=-BOX+sp*(i+0.5), col=new THREE.Group(); col.position.x=x;
    col.add(new THREE.Mesh(geo.lc,lineMat));
    for(const y of [-2.6,0.4,3.4]){const a=new THREE.Mesh(geo.la,lineMat);a.position.y=y;col.add(a);}
    lineGroup.add(col);
  }
}
function buildHand(){
  const tex=new THREE.DataTexture(new Uint8Array([110,185,255]),3,1,THREE.LuminanceFormat);
  tex.minFilter=tex.magFilter=THREE.NearestFilter; tex.needsUpdate=true;
  skinMat=new THREE.MeshToonMaterial({color:TONES[S.tone],gradientMap:tex,transparent:true});
  nailMat=new THREE.MeshToonMaterial({color:0xffffff,gradientMap:tex,transparent:true,opacity:0.5});
  hand=new THREE.Group(); const md=new THREE.Group(); hand.add(md);
  const sph=new THREE.SphereGeometry(0.5,30,22);
  const palm=new THREE.Mesh(sph,skinMat); palm.scale.set(1.18,1.02,0.38); md.add(palm);
  const heel=new THREE.Mesh(sph,skinMat); heel.scale.set(0.78,0.86,0.34); heel.position.set(-0.45,-0.05,0); md.add(heel);
  const fs=[[0.34,0.95,0.112],[0.11,1.06,0.118],[-0.12,0.98,0.112],[-0.33,0.78,0.098]];
  fs.forEach(([y,len,r])=>{
    const g=new THREE.Group(); g.position.set(0.42,y,0);
    const cy=new THREE.Mesh(new THREE.CylinderGeometry(r*0.9,r,len,16),skinMat); cy.rotation.z=-Math.PI/2; cy.position.x=len/2; g.add(cy);
    const tip=new THREE.Mesh(new THREE.SphereGeometry(r*0.9,16,12),skinMat); tip.position.x=len; g.add(tip);
    const nail=new THREE.Mesh(new THREE.SphereGeometry(r*0.7,12,8),nailMat); nail.scale.set(1.25,0.85,0.3); nail.position.set(len-r*0.35,0,r*0.62); g.add(nail);
    g.rotation.z=y*0.06; md.add(g);
  });
  thumbG=new THREE.Group(); thumbG.position.set(0.05,0.42,0);
  const tc=new THREE.Mesh(new THREE.CylinderGeometry(0.115,0.135,0.72,16),skinMat); tc.position.y=0.36; thumbG.add(tc);
  const tt=new THREE.Mesh(new THREE.SphereGeometry(0.118,16,12),skinMat); tt.position.y=0.72; thumbG.add(tt);
  const tn=new THREE.Mesh(new THREE.SphereGeometry(0.09,12,8),nailMat); tn.scale.set(0.85,1.25,0.3); tn.position.set(0,0.64,0.1); thumbG.add(tn);
  md.add(thumbG);
  hand.scale.setScalar(1.7);
  scene.add(hand);
}
function poseQuat(bx,by,bz,vx,vy){
  V.X.set(bx,by,bz).normalize(); V.Y.set(vx,vy,0).normalize();
  const par=Math.abs(V.X.dot(V.Y))>0.92; if(par)V.Y.set(1,0,0);
  V.Y.addScaledVector(V.X,-V.X.dot(V.Y)).normalize(); V.Z.crossVectors(V.X,V.Y);
  V.M.makeBasis(V.X,V.Y,V.Z); V.Q.setFromRotationMatrix(V.M); return par;
}
function update3(dt){
  buildField();
  const ph=S.phiLive*Math.PI/180, s=Math.sin(ph), c=Math.cos(ph);
  cube.rotation.x=-ph;
  darts.forEach(d=>d.rotation.x=-ph);
  const par=clamp((Math.abs(s)-0.86)/0.12,0,1);
  dartMat.opacity=dartDark.opacity=1-par; dartGroup.visible=par<0.99;
  lineMat.opacity=par; lineGroup.visible=par>0.01; lineGroup.rotation.z=s>0?0:Math.PI;
  // hand
  const flying=main&&(S.mode==='flying'||S.mode==='paused');
  let vx=0,vy=1,px,py,sc,k;
  if(flying){
    const att=main.entered&&main.alive;
    if(att){const sp=Math.hypot(main.vx,main.vy)||1;vx=main.vx/sp;vy=main.vy/sp;const bz0=Bz(main.B);let ox=-vy,oy=vx;if(main.q&&bz0){const s=Math.sign(main.q*bz0);ox=-vy*s;oy=vx*s;}px=main.x+ox*1.35;py=main.y+oy*1.35;}
    else{px=-1.5;py=-BOX;}

    else if(S.ghost.on){
      const items=S.ghost.mult.map(k=>({k,r:rOf(ghostParams(k,p)),t:S.ghost.v+' '+fK(k)})).concat([{k:1,r:rOf(p),t:'you',me:1}]).sort((a,b)=>a.k-b.k);
      line='r '+items.map(it=>'<span class="gc'+(it.me?' me':'')+'">'+it.t+' '+(isFinite(it.r)?f1(it.r):'∞')+'</span>').join('');
    }else if(exp)line='r = ('+hlv('m',S.m.toFixed(1))+' × '+v.toFixed(1)+') / ('+hlv('q',Math.abs(q).toFixed(1))+' × '+hlv('B',S.B.toFixed(1))+') = <b>'+f1(rOf(p))+'</b>';
    else line='r = mv / qB = <b>'+f1(rOf(p))+'</b>';
  }else{
    const F=Math.abs(q)*v*Math.abs(bz);
    line=exp?'F = '+hlv('q',Math.abs(q).toFixed(1))+' × '+v.toFixed(1)+' × '+(bz?hlv('B',S.B.toFixed(1)):'0')+' = <b>'+f1(F)+'</b>':'F = qvB = <b>'+f1(F)+'</b>'+(bz?'':' · v ∥ B');
  }
  const h=(exp&&S.badgeTxt?'<span class="badge">'+S.badgeTxt+'</span>':'')+'<span class="line">'+line+'</span>';
  if(h!==eqHTML){eqHTML=h;$('#eq').innerHTML=h;}
}
let hintTxt='';
function renderHint(){
  let t;
  const g=gesture;
  if(g&&g.type==='pull')t='Release to launch. Pull further for more speed.';
  else if(g&&g.type==='rotate')t='Let go and the field lands on the nearest face.';
  else if(S.editing)t='Drag sideways for charge, up or down for mass. Let go to finish.';
  else if(S.mode==='flying')t='Tap the charge to pause. Double tap to reset.';
  else if(S.mode==='paused')t='Paused. Hold the charge to edit, tap to resume.';
  else t='Pull the charge down to launch. Hold it to edit. Swipe the field to roll B.';
  if(t!==hintTxt){hintTxt=t;$('#hint').textContent=t;}
}

/* ---------- loop ---------- */
function frame(now){
  const dt=Math.min(0.033,(now-last)/1000); last=now;
  if(S.mode==='flying'){
    const n=6; for(let i=0;i<n;i++){ if(main.alive)step(main,dt/n); ghosts.forEach(g=>g.alive&&step(g,dt/n)); }
    main.trail.push([main.x,main.y]); ghosts.forEach(g=>g.alive&&g.trail.push([g.x,g.y]));
    if(main.trail.length>3000)main.trail.shift();
    if(!main.alive)pop();
  }else if(S.mode==='popping'){ S.popT-=dt; if(S.popT<=0)home(); }
  bursts.forEach(b=>b.t+=dt); bursts=bursts.filter(b=>b.t<0.35);
  if(S.fadeT<1)S.fadeT=Math.min(1,S.fadeT+dt/0.3);
  if(!(gesture&&gesture.type==='rotate'))S.phiLive+=(S.phi-S.phiLive)*(RM?1:Math.min(1,dt*12));
  const tt=(S.mode==='flying'||S.mode==='paused'||(gesture&&gesture.type==='pull'))?0:1; S.tilt+=(tt-S.tilt)*(RM?1:Math.min(1,dt*5));
  if(HAS3){placeCam();update3(dt);renderer.render(scene,cam);}
  draw(now); renderEq(); renderHint();
  requestAnimationFrame(frame);
}

/* ---------- controls ---------- */
$('#eq').addEventListener('click',()=>{S.eqMode=S.eqMode==='r'?'F':'r';});
$('#eyeBtn').addEventListener('click',e=>{S.eye=!S.eye;e.currentTarget.setAttribute('aria-pressed',S.eye);if(main&&S.eye)preds=[simulate(main)];});
$('#startBtn').addEventListener('click',e=>{if(S.mode!=='idle')home();S.inside=!S.inside;e.currentTarget.textContent='Start: '+(S.inside?'inside':'outside');});
function syncGhost(){
  $('#gOn').checked=S.ghost.on; $('#ghostBtn').setAttribute('aria-pressed',S.ghost.on);
  document.querySelectorAll('#gVar button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.ghost.v));
  document.querySelectorAll('#gMult button').forEach(b=>b.setAttribute('aria-pressed',S.ghost.mult.includes(+b.dataset.k)));
}
function sheet(name,o){$('#'+name+'Sheet').hidden=!o;$('#'+name+'Back').hidden=!o;}
$('#ghostBtn').addEventListener('click',()=>{syncGhost();sheet('ghost',true);});
$('#ghostBack').addEventListener('click',()=>sheet('ghost',false));
$('#gDone').addEventListener('click',()=>sheet('ghost',false));
$('#gOn').addEventListener('change',e=>{S.ghost.on=e.target.checked;syncGhost();});
$('#gVar').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.ghost.v=b.dataset.v;S.ghost.on=true;syncGhost();});
$('#gMult').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const k=+b.dataset.k,m=S.ghost.mult;
  if(m.includes(k)){if(m.length>1)m.splice(m.indexOf(k),1);}else{m.push(k);if(m.length>2)m.shift();}
  m.sort((a,b)=>a-b);S.ghost.on=true;syncGhost();});
const tonesEl=$('#tones');
TONES.forEach((t,i)=>{const b=document.createElement('button');b.style.background=t;b.setAttribute('aria-label','Skin tone '+(i+1));b.dataset.i=i;tonesEl.appendChild(b);});
function syncHand(){
  $('#hOn').checked=S.hand; $('#handBtn').setAttribute('aria-pressed',S.hand);
  tonesEl.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.i===S.tone));
  if(HAS3)skinMat.color.set(TONES[S.tone]);
}
$('#handBtn').addEventListener('click',()=>{syncHand();sheet('hand',true);});
$('#handBack').addEventListener('click',()=>sheet('hand',false));
$('#hDone').addEventListener('click',()=>sheet('hand',false));
$('#hOn').addEventListener('change',e=>{S.hand=e.target.checked;save();syncHand();});
tonesEl.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.tone=+b.dataset.i;save();syncHand();});

if(HAS3){try{init3();}catch(err){console.error(err);HAS3=false;}}
window.addEventListener('resize',()=>{layout();if(S.mode!=='idle')home();});
layout(); syncGhost(); syncHand(); requestAnimationFrame(frame);
})();
</script>

</html>
